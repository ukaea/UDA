# OIDC configuration for the demonstrator.
#
# udaserver.sh sources every .cfg in etc/plugins.d after the main config, so this is where
# a deployment adds its own settings without editing generated files.

export UDA_SERVER_AUTHENTICATION=OIDC

# Who issues tokens, and which audience this server accepts. The issuer must match the
# token's `iss` claim exactly — it is a string comparison, not a fetch.
export UDA_SERVER_OIDC_ISSUER=${UDA_DEMO_ISSUER:-http://127.0.0.1:8080/realms/uda-test}
export UDA_SERVER_OIDC_AUDIENCE=${UDA_DEMO_AUDIENCE:-uda}

# Where to actually fetch the signing keys.
#
# Normally UDA derives this from the issuer via OIDC discovery and this is left unset. It
# is set here because of a split that real deployments hit too: tokens are minted from the
# host, so their `iss` says 127.0.0.1:8080, but this server runs in a container where
# 127.0.0.1 is its own loopback. UDA_SERVER_OIDC_JWKS_URI separates "what string must iss
# equal" from "where do I go to get the keys", which is exactly the case it exists for.
if [ -n "${UDA_DEMO_JWKS_URI:-}" ]; then
    export UDA_SERVER_OIDC_JWKS_URI=$UDA_DEMO_JWKS_URI
fi

# The authorisation rule. A verified token is not enough: the bearer must also satisfy
# this. Override UDA_DEMO_POLICY to experiment without rebuilding.
export UDA_SERVER_OIDC_REQUIRED_CLAIMS=${UDA_DEMO_POLICY:-groups:contains:/uda-users}

# Demonstrator only. The first allows the JWKS to be fetched over plain HTTP; the second
# silences the warning about carrying a token over an unencrypted connection. A real
# deployment sets neither and runs with UDA_SERVER_TLS_MODE=server or mutual.
export UDA_SERVER_OIDC_ALLOW_HTTP=1
export UDA_ALLOW_TOKEN_WITHOUT_TLS=1

# HELP::authorise() — asks a separate service whether a claim value is allowed.
export UDA_HELP_AUTHZ_URL=${UDA_DEMO_AUTHZ_URL:-http://authz:8765/authorize}
export UDA_HELP_AUTHZ_CLAIM=preferred_username
export UDA_HELP_AUTHZ_EXPECT=True

export UDA_LOG=/opt/uda/logs
export UDA_LOG_LEVEL=DEBUG
mkdir -p "$UDA_LOG" 2>/dev/null
