name: Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

# prevent duplicate CI runs from separate triggers
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: [Release]
        ssl: [ON, OFF]
        client-only: [ON, OFF]
        capnp: [ON, OFF]
        exclude:
          - os: windows-latest
            client-only: OFF
          - os: ubuntu-latest
            client-only: ON
          - os: macos-latest
            client-only: ON

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v8
        with:
          fetch-depth: 0
          fetch-tags: true
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt update && sudo apt install -y
          git
          libboost-dev
          libboost-program-options-dev
          libssl-dev
          cmake
          build-essential
          libtirpc-dev
          pkg-config
          libxml2-dev
          libspdlog-dev
          ninja-build
          capnproto
          libcapnp-dev
          python3-dev
          python3-pip
          python3-venv
          libcurl4-openssl-dev

      # Capnproto package on Ubuntu 24.04 has broken CMake file
      - name: Fix Capnproto on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          file=/usr/lib/x86_64-linux-gnu/cmake/CapnProto/CapnProtoConfig.cmake
          test -f "$file"
          sudo sed -i 's/if (yes)  # WITH_LIBATOMIC/if (no)  # WITH_LIBATOMIC/' "$file"
      - name: Install Intel compiler
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt install -y wget gpg ca-certificates &&
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          | gpg --dearmor
          | sudo tee /usr/share/keyrings/intel-oneapi-archive-keyring.gpg > /dev/null &&
          echo "deb [signed-by=/usr/share/keyrings/intel-oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main"
          | sudo tee /etc/apt/sources.list.d/oneAPI.list &&
          sudo apt-get update &&
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
      - name: Install macos dependencies
        if: matrix.os == 'macos-latest'
        run: >
          brew update-reset && brew install
          git
          boost
          openssl
          cmake
          pkg-config
          libxml2
          spdlog
          ninja
          capnp

#      - name: Cache windows packages
#        id: cache-vcpkg
#        uses: actions/cache@v3
#        env:
#          cache-name: cache-vcpkg-packages
#        with:
#          path: C:/vcpkg
#          key: ${{ runner.os }}-build-${{ env.cache-name }}

      - name: Install windows dependencies
        if: matrix.os == 'windows-latest'
        run: >
          vcpkg install --triplet x64-mingw-static --binarysource="clear;x-gha,readwrite"
          libxml2
          capnproto
          boost-program-options
          boost-format
          boost-algorithm
          boost-multi-array
          openssl
          dlfcn-win32
          spdlog
          liblzma
          curl[openssl]

      - name: Configure CMake (linux)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cmake -G Ninja -B build
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}

      - name: Configure CMake (linux Intel)
        if: matrix.os == 'ubuntu-latest'
        run: >
          source /opt/intel/oneapi/setvars.sh &&
          CC="$(command -v icx)" CXX="$(command -v icpx)"
          cmake -G Ninja -B build-intel
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}

      - name: Configure CMake (macos)
        if: matrix.os == 'macos-latest'
        run: >
          cmake -G Ninja -B build
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Configure portable XDR
        if: matrix.os == 'windows-latest'
        run: >
          cd extlib
          && cmake -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -B build -G "MinGW Makefiles" .

      - name: Build portable XDR
        if: matrix.os == 'windows-latest'
        run: cd extlib && cmake --build build

      - name: Install portable XDR
        if: matrix.os == 'windows-latest'
        run: cd extlib && cmake --install build --prefix install

      - name: Configure CMake (windows)
        if: matrix.os == 'windows-latest'
        run: >
          XDR_ROOT=extlib/install cmake -G "MinGW Makefiles" -B build
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/uda_install

      - name: Build
        run: cmake --build build --config ${{ matrix.release }}

      - name: Build Intel
        if: matrix.os == 'ubuntu-latest'
        run: cmake --build build-intel --config ${{ matrix.release }}

      - name: Install
        if: matrix.os != 'windows-latest'
        run: sudo cmake --install build --config ${{ matrix.release }}

      - name: Install
        if: matrix.os == 'windows-latest'
        run: cmake --install build --config ${{ matrix.release }}

      - name: Install pyuda
        if: matrix.os == 'ubuntu-latest'
        run: >
          cp -r /usr/local/python_installer ${{github.workspace}}/python_installer &&
          python3 -m venv ${{github.workspace}}/venv &&
          source ${{github.workspace}}/venv/bin/activate &&
          pip3 install --upgrade pip &&
          pip3 install wheel Cython "numpy<2" six &&
          pip3 install ${{github.workspace}}/python_installer

      - name: Test pyuda import
        if: matrix.os == 'ubuntu-latest'
        run: >
          source ${{github.workspace}}/venv/bin/activate &&
          python3 -c 'import pyuda; client=pyuda.Client()'

      # Unit tests run on both ssl=ON and ssl=OFF. The authentication suites are only
      # configured when ENABLE_OIDC_AUTH is on, which only happens on the ssl=ON job, so
      # gating this on ssl=OFF alone means they never run at all.
      - name: Run unit tests
        if: matrix.os == 'ubuntu-latest'
        run: ctest -V --test-dir build/test/unit_tests --output-on-failure

      - name: Run non-SSL system tests
        if: matrix.os == 'ubuntu-latest' && matrix.ssl == 'OFF'
        run: >
          sudo cp /usr/local/etc/uda.socket /usr/local/etc/uda@.service /etc/systemd/system &&
          sudo chown -R $USER:$USER /usr/local/etc &&
          echo "export UDA_SERVER_SSL_AUTHENTICATE=OFF" >> /usr/local/etc/udaserver.cfg &&
          sudo systemctl start uda.socket &&
          sudo systemctl enable uda.socket &&
          nc -4zv localhost 56565 &&
          export UDA_HOST=localhost &&
          export UDA_PORT=56565 &&
          ./build/test/plugins/plugin_test_testplugin &&
          uda_cli --help && uda_cli --request "help::help()"

      # NB: this was previously gated on ubuntu-22.04, which is not in the matrix, so the
      # step never ran. The matrix uses ubuntu-latest.
      - name: Run SSL system tests
        if: matrix.os == 'ubuntu-latest' && matrix.ssl == 'ON'
        run: |
          sudo cp /usr/local/etc/uda.socket /usr/local/etc/uda@.service /etc/systemd/system
          sudo chown -R $USER:$USER /usr/local/etc
          # pulls in extra config options from machine.d
          echo "export UDAHOSTNAME=github-ci-ssl" >> /usr/local/etc/udaserver.cfg
          ./scripts/create_certs.sh
          mkdir /usr/local/etc/certs
          cp rootCA.crt server.crt server.key /usr/local/etc/certs
          sudo systemctl start uda.socket
          sudo systemctl enable uda.socket
          nc -4zv localhost 56565
          export UDA_HOST=localhost
          export UDA_PORT=56565
          export UDA_CLIENT_SSL_AUTHENTICATE=OFF
          export UDA_CLIENT_CA_SSL_CERT=$PWD/rootCA.crt
          export UDA_CLIENT_SSL_CERT=$PWD/client.crt
          export UDA_CLIENT_SSL_KEY=$PWD/client.key
          set +e
          /usr/local/bin/uda_cli --request "help::help()" && exit 1 || echo "process failed successfully"
          set -e
          export UDA_CLIENT_SSL_AUTHENTICATE=ON
          ./build/test/plugins/plugin_test_testplugin

      # The OIDC end-to-end suite: a disposable Keycloak, real tokens, a real UDA server.
      # It is the only thing that checks UDA against an actual identity provider rather
      # than against generated keys and mock fetchers.
      - name: Run OIDC end-to-end tests
        if: matrix.os == 'ubuntu-latest' && matrix.ssl == 'ON'
        run: |
          cd test/e2e/keycloak
          docker compose up -d --build
          # Wait for the realm to be served, not merely for the container to start.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 \
                 http://127.0.0.1:8080/realms/uda-test/.well-known/openid-configuration \
                 > /dev/null 2>&1; then
              echo "keycloak ready after ${i} attempts"; break
            fi
            sleep 5
          done
          cd "$GITHUB_WORKSPACE"
          cmake --install build --prefix "$GITHUB_WORKSPACE/e2e-install"
          UDA_INSTALL="$GITHUB_WORKSPACE/e2e-install" \
          UDA_TOKEN_CHECK="$GITHUB_WORKSPACE/build/test/e2e/keycloak/uda_token_check" \
          UDA_CONNECT_CHECK="$GITHUB_WORKSPACE/build/test/e2e/keycloak/uda_connect_check" \
            ./test/e2e/keycloak/run_matrix.sh

      - name: Collect end-to-end logs on failure
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.ssl == 'ON'
        run: |
          cd test/e2e/keycloak
          docker compose logs --tail 100 || true

#      - name: Test
#        working-directory: build
#        # Execute tests defined by the CMake configuration.
#        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
#        run: ctest -C ${{ matrix.release }}
