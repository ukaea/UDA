name: Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

# prevent duplicate CI runs from separate triggers
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: [Release]
        ssl: [ON, OFF]
        client-only: [ON, OFF]
        capnp: [ON, OFF]
        exclude:
          - os: windows-latest
            client-only: OFF
          - os: ubuntu-latest
            client-only: ON
          - os: macos-latest
            client-only: ON

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt update && sudo apt install -y
          git
          libboost-dev
          libboost-program-options-dev
          libssl-dev
          cmake
          build-essential
          libtirpc-dev
          pkg-config
          libxml2-dev
          liblzma-dev
          libspdlog-dev
          ninja-build
          capnproto
          libcapnp-dev
          python3-dev
          python3-pip
          python3-venv

      # Capnproto package on Ubuntu 24.04 has broken CMake file
      - name: Fix Capnproto on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo sed -i 's/if (yes)  # WITH_LIBATOMIC/if (no)  # WITH_LIBATOMIC/' \
            /usr/lib/x86_64-linux-gnu/cmake/CapnProto/CapnProtoConfig.cmake

      - name: Install Intel compiler
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB |
            gpg --dearmor |
            sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" |
            sudo tee /etc/apt/sources.list.d/oneAPI.list
          
          sudo apt update
          sudo apt install -y intel-oneapi-compiler-dpcpp-cpp

      - name: Install macos dependencies
        if: matrix.os == 'macos-latest'
        run: >
          brew update-reset && brew install
          git
          boost
          openssl
          cmake
          pkg-config
          libxml2
          spdlog
          ninja
          capnp

      - name: Cache windows packages
        id: cache-vcpkg
        uses: actions/cache@v6
        env:
          cache-name: cache-vcpkg-packages
        with:
          path: C:/vcpkg
          key: ${{ runner.os }}-build-${{ env.cache-name }}

      - name: Install windows dependencies
        if: matrix.os == 'windows-latest'
        run: >
          vcpkg install --triplet x64-mingw-static --binarysource="clear;x-gha,readwrite"
          libxml2
          capnproto
          boost-program-options
          boost-format
          boost-algorithm
          boost-multi-array
          openssl
          dlfcn-win32
          spdlog
          liblzma
          zlib

      - name: Configure CMake (linux)
        if: matrix.os == 'ubuntu-latest'
        run: >
          cmake -G Ninja -B build
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}

      - name: Configure CMake (linux Intel)
        if: matrix.os == 'ubuntu-latest'
        run: |
          source /opt/intel/oneapi/setvars.sh
          icx --version
          icpx --version
          CXX=icpx CC=icx cmake -G Ninja -B build-intel \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.release }} \
            -DSSLAUTHENTICATION=${{ matrix.ssl }} \
            -DCLIENT_ONLY=${{ matrix.client-only }} \
            -DENABLE_CAPNP=${{ matrix.capnp }}

      - name: Configure CMake (macos)
        if: matrix.os == 'macos-latest'
        run: >
          cmake -G Ninja -B build
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Configure portable XDR
        if: matrix.os == 'windows-latest'
        run: >
          cd extlib
          && cmake -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -B build -G "MinGW Makefiles" .

      - name: Build portable XDR
        if: matrix.os == 'windows-latest'
        run: cd extlib && cmake --build build

      - name: Install portable XDR
        if: matrix.os == 'windows-latest'
        run: cd extlib && cmake --install build --prefix install

      - name: Configure CMake (windows)
        if: matrix.os == 'windows-latest'
        run: >
          XDR_ROOT=extlib/install cmake -G "MinGW Makefiles" -B build
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-mingw-static
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.release }}
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/uda_install
          -DZLIB_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.release }}

      - name: Build Intel
        if: matrix.os == 'ubuntu-latest'
        run: cmake --build build-intel --config ${{ matrix.release }}

      - name: Install
        if: matrix.os != 'windows-latest'
        run: sudo cmake --install build --config ${{ matrix.release }}

      - name: Install
        if: matrix.os == 'windows-latest'
        run: cmake --install build --config ${{ matrix.release }}

      # Run package smoke tests once per OS, with the usual shared/static build.
      - name: Test installed CMake consumers
        if: matrix.ssl == 'OFF' && matrix.capnp == 'OFF'
        run: |
          workspace="$PWD"
          generator="Ninja"
          platform_args=()
          core_prefix=/usr/local
          if [[ "$RUNNER_OS" == Windows ]]; then
            workspace="$(pwd -W)"
            generator="MinGW Makefiles"
            core_prefix="$workspace/uda_install"
            export XDR_ROOT="$workspace/extlib/install"
            export PATH="$PWD/uda_install/lib:$PWD/uda_cpp_install/bin:$PATH"
            platform_args+=(
              -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
              -DVCPKG_TARGET_TRIPLET=x64-mingw-static
              -DZLIB_USE_STATIC_LIBS=ON
            )
          elif [[ "$RUNNER_OS" == macOS ]]; then
            platform_args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          fi

          cpp_prefix="$workspace/uda_cpp_install"
          cmake -G "$generator" -S source/wrappers/c++ -B build-standalone-cpp \
            -DCMAKE_BUILD_TYPE=${{ matrix.release }} -DBUILD_SHARED_LIBS=ON \
            "-DCMAKE_PREFIX_PATH=$core_prefix" "-DCMAKE_INSTALL_PREFIX=$cpp_prefix" \
            "${platform_args[@]}"
          cmake --build build-standalone-cpp --config ${{ matrix.release }}
          cmake --install build-standalone-cpp --config ${{ matrix.release }}

          for target in client_static client_shared cpp_static cpp_shared; do
            cmake -G "$generator" -S test/consumer -B "build-consumer-$target" \
              -DCMAKE_BUILD_TYPE=${{ matrix.release }} \
              "-DCMAKE_PREFIX_PATH=$cpp_prefix;$core_prefix" \
              "-DUDA_CONSUMER_TARGET=UDA::$target" "${platform_args[@]}"
            cmake --build "build-consumer-$target" --config ${{ matrix.release }}
            ctest --test-dir "build-consumer-$target" -C ${{ matrix.release }} --output-on-failure
          done

      - name: Test installed pkg-config consumers
        if: matrix.os != 'windows-latest' && matrix.ssl == 'OFF' && matrix.capnp == 'OFF'
        run: |
          # Install only development files here so the linker selects UDA archives.
          static_prefix="$PWD/uda_pc_static_install"
          cmake --install build --config ${{ matrix.release }} \
            --component development --prefix "$static_prefix"
          test -f "$static_prefix/lib/libuda_client.a"
          test -f "$static_prefix/lib/libuda_cpp.a"
          for module in uda-client uda-cpp; do
            test -f "$static_prefix/lib/pkgconfig/$module.pc"
          done
          for library in uda_client uda_cpp; do
            test ! -e "$static_prefix/lib/lib$library.so"
            test ! -e "$static_prefix/lib/lib$library.dylib"
          done
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="/usr/local/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          platform_args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            for formula in libxml2 openssl@3 fmt; do
              export PKG_CONFIG_PATH="$(brew --prefix "$formula")/lib/pkgconfig:$PKG_CONFIG_PATH"
            done
            platform_args+=("-DCMAKE_CXX_FLAGS=-I$(brew --prefix boost)/include")
          fi

          for linkage in shared static; do
            pc_path="$PKG_CONFIG_PATH"
            pc_static=OFF
            if [[ "$linkage" == static ]]; then
              pc_path="$static_prefix/lib/pkgconfig:$pc_path"
              pc_static=ON
            fi
            for module in uda-client uda-cpp; do
              consumer_build="build-pkgconfig-$module-$linkage"
              PKG_CONFIG_PATH="$pc_path" cmake -G Ninja -S test/pkgconfig -B "$consumer_build" \
                -DCMAKE_BUILD_TYPE=${{ matrix.release }} "-DUDA_PC_MODULE=$module" \
                "-DUDA_PC_STATIC=$pc_static" "${platform_args[@]}"
              cmake --build "$consumer_build" --config ${{ matrix.release }}
              ctest --test-dir "$consumer_build" -C ${{ matrix.release }} --output-on-failure
            done
          done

      - name: Install pyuda
        if: matrix.os == 'ubuntu-latest'
        run: >
          cp -r /usr/local/python_installer ${{github.workspace}}/python_installer &&
          python3 -m venv ${{github.workspace}}/venv &&
          source ${{github.workspace}}/venv/bin/activate &&
          pip3 install --upgrade pip &&
          pip3 install wheel Cython "numpy<2" six &&
          pip3 install ${{github.workspace}}/python_installer

      - name: Test pyuda import
        if: matrix.os == 'ubuntu-latest'
        run: >
          source ${{github.workspace}}/venv/bin/activate &&
          python3 -c 'import pyuda; client=pyuda.Client()'

      - name: Run non-SSL system tests
        if: matrix.os == 'ubuntu-latest' && matrix.ssl == 'OFF'
        run: >
          sudo cp /usr/local/etc/uda.socket /usr/local/etc/uda@.service /etc/systemd/system &&
          sudo chown -R $USER:$USER /usr/local/etc &&
          echo "export UDA_SERVER_SSL_AUTHENTICATE=OFF" >> /usr/local/etc/udaserver.cfg &&
          sudo systemctl start uda.socket &&
          sudo systemctl enable uda.socket &&
          nc -4zv localhost 56565 &&
          export UDA_HOST=localhost &&
          export UDA_PORT=56565 &&
          ./build/test/plugins/plugin_test_testplugin &&
          ctest -V --test-dir build/test/unit_tests --output-on-failure &&
          uda_cli --help && uda_cli --request "help::help()"

      - name: Run SSL system tests
        if: matrix.os == 'ubuntu-22.04' && matrix.ssl == 'ON'
        run: |
          sudo cp /usr/local/etc/uda.socket /usr/local/etc/uda@.service /etc/systemd/system
          sudo chown -R $USER:$USER /usr/local/etc
          # pulls in extra config options from machine.d
          echo "export UDAHOSTNAME=github-ci-ssl" >> /usr/local/etc/udaserver.cfg
          ./scripts/create_certs.sh
          mkdir /usr/local/etc/certs
          cp rootCA.crt server.crt server.key /usr/local/etc/certs
          sudo systemctl start uda.socket
          sudo systemctl enable uda.socket
          nc -4zv localhost 56565
          export UDA_HOST=localhost
          export UDA_PORT=56565
          export UDA_CLIENT_SSL_AUTHENTICATE=OFF
          export UDA_CLIENT_CA_SSL_CERT=$PWD/rootCA.crt
          export UDA_CLIENT_SSL_CERT=$PWD/client.crt
          export UDA_CLIENT_SSL_KEY=$PWD/client.key
          set +e
          /usr/local/bin/uda_cli --request "help::help()" && exit 1 || echo "process failed successfully"
          set -e
          export UDA_CLIENT_SSL_AUTHENTICATE=ON
          ./build/test/plugins/plugin_test_testplugin

#      - name: Test
#        working-directory: build
#        # Execute tests defined by the CMake configuration.
#        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
#        run: ctest -C ${{ matrix.release }}

