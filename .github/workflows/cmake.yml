name: Build

env:
  CONFIG: Release

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

# prevent duplicate CI runs from separate triggers
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ssl: [ON, OFF]
        client-only: [ON, OFF]
        capnp: [ON, OFF]
        exclude:
          - os: windows-latest
            client-only: OFF
          - os: ubuntu-latest
            client-only: ON
          - os: macos-latest
            client-only: ON

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt update && sudo apt install -y
          git
          libboost-dev
          libboost-program-options-dev
          libssl-dev
          cmake
          build-essential
          libtirpc-dev
          pkg-config
          libxml2-dev
          liblzma-dev
          libspdlog-dev
          ninja-build
          capnproto
          libcapnp-dev
          python3-dev
          python3-pip
          python3-venv

      # Capnproto package on Ubuntu 24.04 has broken CMake file
      - name: Fix Capnproto on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo sed -i 's/if (yes)  # WITH_LIBATOMIC/if (no)  # WITH_LIBATOMIC/' \
            /usr/lib/x86_64-linux-gnu/cmake/CapnProto/CapnProtoConfig.cmake

      - name: Install Intel compiler
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB |
            gpg --dearmor |
            sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" |
            sudo tee /etc/apt/sources.list.d/oneAPI.list

          sudo apt update
          sudo apt install -y intel-oneapi-compiler-dpcpp-cpp

      - name: Install macos dependencies
        if: matrix.os == 'macos-latest'
        run: >
          brew update-reset && brew install
          git
          boost
          openssl
          cmake
          pkg-config
          libxml2
          spdlog
          ninja
          capnp

      - name: Cache windows packages
        if: matrix.os == 'windows-latest'
        id: cache-vcpkg
        uses: actions/cache@v6
        env:
          cache-name: cache-vcpkg-packages
        with:
          path: C:/vcpkg
          # The package list lives in this workflow, so a change to it refreshes the cache.
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('.github/workflows/cmake.yml') }}

      - name: Install windows dependencies
        if: matrix.os == 'windows-latest'
        run: >
          vcpkg install --triplet x64-mingw-static --binarysource="clear;x-gha,readwrite"
          libxml2
          capnproto
          boost-program-options
          boost-format
          boost-algorithm
          boost-multi-array
          openssl
          dlfcn-win32
          spdlog
          liblzma
          zlib

      - name: Configure CMake (linux, macos)
        if: matrix.os != 'windows-latest'
        run: |
          platform_args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            platform_args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          else
            platform_args+=("-DENABLE_LANDLOCK=ON")
          fi
          cmake -G Ninja -B build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=$CONFIG \
            -DSSLAUTHENTICATION=${{ matrix.ssl }} \
            -DCLIENT_ONLY=${{ matrix.client-only }} \
            -DENABLE_CAPNP=${{ matrix.capnp }} \
            "${platform_args[@]}"

      - name: Configure CMake (linux Intel)
        if: matrix.os == 'ubuntu-latest'
        run: |
          source /opt/intel/oneapi/setvars.sh
          icx --version
          icpx --version
          CXX=icpx CC=icx cmake -G Ninja -B build-intel \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=$CONFIG \
            -DSSLAUTHENTICATION=${{ matrix.ssl }} \
            -DCLIENT_ONLY=${{ matrix.client-only }} \
            -DENABLE_CAPNP=${{ matrix.capnp }} \
            -DENABLE_LANDLOCK=ON

      - name: Build and install portable XDR
        if: matrix.os == 'windows-latest'
        run: |
          cd extlib
          cmake -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -B build -G "MinGW Makefiles" .
          cmake --build build
          cmake --install build --prefix install

      - name: Configure CMake (windows)
        if: matrix.os == 'windows-latest'
        run: >
          XDR_ROOT=extlib/install cmake -G "MinGW Makefiles" -B build
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-mingw-static
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=$CONFIG
          -DSSLAUTHENTICATION=${{ matrix.ssl }}
          -DCLIENT_ONLY=${{ matrix.client-only }}
          -DENABLE_CAPNP=${{ matrix.capnp }}
          -DCMAKE_INSTALL_PREFIX=$(pwd -W)/uda_install
          -DZLIB_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build --config $CONFIG

      - name: Build Intel
        if: matrix.os == 'ubuntu-latest'
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build-intel --config $CONFIG

      - name: Test Landlock enforcement
        if: matrix.os == 'ubuntu-latest'
        run: |
          ctest --test-dir build/test/landlock --output-on-failure --no-tests=error
          source /opt/intel/oneapi/setvars.sh
          ctest --test-dir build-intel/test/landlock --output-on-failure --no-tests=error

      - name: Test Landlock policy rejection without support
        if: matrix.os == 'macos-latest' && matrix.client-only == 'OFF'
        run: ctest --test-dir build/test -R Landlock_server_plugin_disabled --output-on-failure --no-tests=error

      - name: Install
        run: |
          prefix=$(sed -n 's/^CMAKE_INSTALL_PREFIX:PATH=//p' build/CMakeCache.txt)
          echo "install prefix: $prefix"
          status=0
          ${{ matrix.os != 'windows-latest' && 'sudo ' || '' }}cmake --install build --config $CONFIG > install.log 2>&1 || status=$?
          head -n 5 install.log
          exit $status

      - name: Smoke test installed package
        if: matrix.ssl == 'OFF' && matrix.capnp == 'OFF'
        env:
          GENERATOR: ${{ matrix.os == 'windows-latest' && 'MinGW Makefiles' || 'Ninja' }}
          PKGCONFIG: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              workspace="$(pwd -W)"
              # Use the prefix CMake installed to, rather than rebuilding it from the workspace path.
              core=$(cygpath -m "$(sed -n 's/^CMAKE_INSTALL_PREFIX:PATH=//p' build/CMakeCache.txt)")
              export XDR_ROOT="$workspace/extlib/install"
              grep -E '^UDA_XDR_RUNTIME:' build/CMakeCache.txt || true
              grep -Ei '[/\\]libxdr\.dll[[:space:]]*$' build/install_manifest.txt || true
              if [[ ! -f "$core/bin/libxdr.dll" ]]; then
                echo "error: libxdr.dll is missing from $core/bin" >&2
                exit 1
              fi
              # Git Bash needs POSIX paths in its colon-separated PATH.
              core_bin=$(cygpath -u "$core/bin")
              cpp_bin=$(cygpath -u "$workspace/uda_cpp_install/bin")
              cxx=$(sed -n 's/^CMAKE_CXX_COMPILER:[^=]*=//p' build/CMakeCache.txt)
              mingw_bin=$(dirname "$(cygpath -u "$cxx")")
              export PATH="$core_bin:$cpp_bin:$mingw_bin:$PATH"
              echo "MinGW runtime directory: $mingw_bin"
              where.exe libxdr.dll || echo "warning: native PATH lookup did not find libxdr.dll" >&2
              args=(
                -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
                -DVCPKG_TARGET_TRIPLET=x64-mingw-static
                -DZLIB_USE_STATIC_LIBS=ON
              )
              ;;
            macOS)
              workspace="$PWD"
              core=$(sed -n 's/^CMAKE_INSTALL_PREFIX:PATH=//p' build/CMakeCache.txt)
              args=(
                "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
                "-DCMAKE_CXX_FLAGS=-I$(brew --prefix boost)/include"
              )
              for formula in libxml2 openssl@3 fmt; do
                export PKG_CONFIG_PATH="$(brew --prefix "$formula")/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
              done
              ;;
            *)
              workspace="$PWD"
              core=$(sed -n 's/^CMAKE_INSTALL_PREFIX:PATH=//p' build/CMakeCache.txt)
              args=()
              ;;
          esac
          if [[ "$RUNNER_OS" != Windows ]]; then
            export LD_LIBRARY_PATH="$core/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export DYLD_LIBRARY_PATH="$core/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          scripts/ci/smoke-installed.sh "$core" "$workspace/uda_cpp_install" build "${args[@]}"

      - name: Install pyuda
        if: matrix.os == 'ubuntu-latest'
        run: >
          cp -r /usr/local/python_installer ${{github.workspace}}/python_installer &&
          python3 -m venv ${{github.workspace}}/venv &&
          source ${{github.workspace}}/venv/bin/activate &&
          pip3 install --upgrade pip &&
          pip3 install wheel Cython "numpy<2" six &&
          pip3 install ${{github.workspace}}/python_installer

      - name: Test pyuda import
        if: matrix.os == 'ubuntu-latest'
        run: >
          source ${{github.workspace}}/venv/bin/activate &&
          python3 -c 'import pyuda; client=pyuda.Client()'

      - name: Run non-SSL system tests
        if: matrix.os == 'ubuntu-latest' && matrix.ssl == 'OFF'
        run: >
          sudo cp /usr/local/etc/uda.socket /usr/local/etc/uda@.service /etc/systemd/system &&
          sudo chown -R $USER:$USER /usr/local/etc &&
          echo "export UDA_SERVER_SSL_AUTHENTICATE=OFF" >> /usr/local/etc/udaserver.cfg &&
          sudo systemctl start uda.socket &&
          sudo systemctl enable uda.socket &&
          nc -4zv localhost 56565 &&
          export UDA_HOST=localhost &&
          export UDA_PORT=56565 &&
          ./build/test/plugins/plugin_test_testplugin &&
          ctest -V --test-dir build/test/unit_tests --output-on-failure &&
          uda_cli --help && uda_cli --request "help::help()"

      - name: Run SSL system tests
        if: matrix.os == 'ubuntu-latest' && matrix.ssl == 'ON'
        run: |
          sudo cp /usr/local/etc/uda.socket /usr/local/etc/uda@.service /etc/systemd/system
          sudo chown -R $USER:$USER /usr/local/etc
          # pulls in extra config options from machine.d
          echo "export UDAHOSTNAME=github-ci-ssl" >> /usr/local/etc/udaserver.cfg
          ./scripts/create_certs.sh
          mkdir /usr/local/etc/certs
          cp rootCA.crt server.crt server.key /usr/local/etc/certs
          sudo systemctl start uda.socket
          sudo systemctl enable uda.socket
          nc -4zv localhost 56565
          export UDA_HOST=localhost
          export UDA_PORT=56565
          export UDA_CLIENT_SSL_AUTHENTICATE=OFF
          export UDA_CLIENT_CA_SSL_CERT=$PWD/rootCA.crt
          export UDA_CLIENT_SSL_CERT=$PWD/client.crt
          export UDA_CLIENT_SSL_KEY=$PWD/client.key
          set +e
          /usr/local/bin/uda_cli --request "help::help()" && exit 1 || echo "process failed successfully"
          set -e
          export UDA_CLIENT_SSL_AUTHENTICATE=ON
          ./build/test/plugins/plugin_test_testplugin
